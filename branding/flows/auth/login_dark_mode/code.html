    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

<body class="bg-ink text-text-main min-h-screen flex flex-col justify-between selection:bg-accent-crimson selection:text-text-main antialiased relative overflow-x-hidden">
<!-- Subtle Ambient Bookish Texture/Glow -->
<div class="fixed inset-0 pointer-events-none opacity-40 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#271E19] via-transparent to-transparent"></div>
<!-- Top Simple Navigation for Focused View -->
<header class="w-full max-w-7xl mx-auto px-6 py-6 flex items-center relative z-10 justify-center">

<div class="text-sm uppercase tracking-widest font-semibold font-raleway text-text-muted">Bookly</div>
</header>
<!-- Main Sign In Container -->
<main class="w-full flex-1 flex flex-col items-center justify-center px-4 py-8 relative z-10">
<div class="size-16 mb-6 rounded-xl bg-ink-surface border border-ink-border p-2.5 flex items-center justify-center shadow-inner relative group"><div class="absolute inset-0 bg-accent-crimson/5 rounded-xl blur group-hover:bg-accent-crimson/10 transition-colors"></div><img alt="Bookly Mark" class="w-full h-full object-contain relative z-10" data-alt="An exquisite minimalist dark brand emblem for the literary salon application Bookly, illuminated against an opulent deep obsidian and warm umber background with subtle crimson highlights." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAGH1MUFqc6IGFwM2hh7cPoe_8_zp5WffLifmkP_kqpUS6pMBCD_90TZt_eVX879GsmxC59JQsHA1NEpDQVj_0JhOtiyVZA3Qm0Rpc7Dz7ju2LwuVHOekiF-vfF0dpLE4aqiDW-5FPdprzAxnhgetwrKeN_WpU2vanK6ELUgUIlLWz6jR_-B9p0LN56mhUzOBFqandJERSewUdSNtmE4Lj29WVub9BS4do8yH69QngCDTpKJaAEGT_n9ix1kwAt2ga7lzQ"></div><div class="w-full max-w-[440px] bg-ink-surface/80 backdrop-blur-sm border border-ink-border rounded-xl p-8 sm:p-10 shadow-2xl relative">
<!-- Brand Mark Header -->
<div class="flex flex-col items-center text-center mb-8">

<h1 class="text-text-main text-[26px] sm:text-[28px] font-bold font-raleway tracking-tight leading-snug mb-2.5">
          Welcome Back to Your Circle
        </h1>
<p class="text-text-muted text-sm sm:text-base font-serif leading-relaxed">
          Sign in to resume reading with your salons.
        </p>
</div>
<!-- Sign In Form -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-xs uppercase tracking-wider font-semibold font-sans text-text-muted" for="email">
            Email Address
          </label>
<div class="relative">
<input class="w-full h-12 bg-ink-surface border border-ink-border focus:border-text-link rounded-[8px] px-4 text-text-main placeholder-text-placeholder text-sm font-sans focus:outline-none focus:ring-1 focus:ring-text-link transition duration-200" id="email" placeholder="name@example.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<label class="block text-xs uppercase tracking-wider font-semibold font-sans text-text-muted" for="password">
            Password
          </label>
<div class="relative">
<input class="w-full h-12 bg-ink-surface border border-ink-border focus:border-text-link rounded-[8px] pl-4 pr-11 text-text-main placeholder-text-placeholder text-sm font-sans focus:outline-none focus:ring-1 focus:ring-text-link transition duration-200" id="password" placeholder="••••••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-text-placeholder hover:text-text-main focus:outline-none transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Row: Remember me & Forgot Password -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2.5 cursor-pointer group">
<input class="w-4 h-4 rounded-[4px] border-ink-border bg-ink-surface text-accent-crimson focus:ring-0 focus:ring-offset-0 focus:outline-none cursor-pointer" type="checkbox">
<span class="text-xs font-sans text-text-muted group-hover:text-text-main transition-colors">Remember this device</span>
</label>
<a class="text-xs font-sans font-medium text-text-link hover:underline transition-all" href="#">
            Forgot password?
          </a>
</div>
<!-- Action Button -->
<div class="pt-2">
<button class="w-full h-12 bg-accent-crimson hover:bg-accent-crimson-hover text-text-main font-sans font-semibold rounded-[12px] flex items-center justify-center gap-2 shadow-lg shadow-accent-crimson/20 active:scale-[0.99] transition duration-200 cursor-pointer" type="submit">
<span class="">Sign In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider -->

<!-- Social Logins -->

</div>
<!-- Register Link -->
<div class="mt-8 text-center text-sm font-sans">
<span class="text-text-muted">New to Bookly?</span>
<a class="ml-1 text-text-link hover:underline font-medium transition-colors" href="#">
        Create an account
      </a>
</div>
</main>
<!-- Literary Quote Subtle Footer -->
<footer class="w-full max-w-7xl mx-auto px-6 py-6 text-center text-xs font-serif text-text-placeholder/60 relative z-10">
<p class="">“A room without books is like a body without a soul.” — Cicero</p>
</footer>
<script>
    // Password toggle functionality
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  </script>


</body></html>
