<body class="bg-[#F4EEE3] text-[#1B1714] min-h-screen flex flex-col justify-between selection:bg-[#7A1F2B] selection:text-[#FBF8F2] antialiased relative overflow-x-hidden">
<!-- Subtle Ambient Bookish Texture/Glow -->
<div class="fixed inset-0 pointer-events-none opacity-60 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#EDE4D4] via-transparent to-transparent"></div>
<!-- Top Simple Navigation for Focused View -->
<header class="w-full max-w-7xl mx-auto px-6 py-6 flex items-center relative z-10 justify-center">
<div class="text-sm uppercase tracking-widest font-semibold font-raleway text-[#5C534A]">Bookly</div>
</header>
<!-- Main Sign In Container -->
<main class="w-full flex-1 flex flex-col items-center justify-center px-4 py-8 relative z-10">
<div class="size-16 mb-6 rounded-xl bg-[#FBF8F2] border border-[#D9CFBD] p-2 flex items-center justify-center shadow-sm relative group"><img alt="Bookly Mark" class="w-full h-full object-contain relative z-10" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCFbxusLC83RbT3K8ubdNDsW0XOVzsiCvpkHwaKJjFAkexd4BewBLUKb6PaVVSfS7JvRCpgEkGuXYQPh45ioXLzRMCWmTbh_chwtDmVPQSNOsvSh5XpF_EzpRNU5KCu1jWDpSQR-vjqwOHm0_pcdFrCJzFc2bIoLy9CqZxzmXhd9q6eh49mkLjho6hTFLHiKRhs_tqQP-3Xt4KSBLYDYDaZU8c_dcomWn3YRM82Wpi_HkI3_7MYV_Ridppc5zSjCZeW7bw"/></div><div class="w-full max-w-[440px] bg-[#FBF8F2] border border-[#D9CFBD] rounded-xl p-8 sm:p-10 shadow-[0_4px_20px_-2px_rgba(27,23,20,0.06)] relative">
<!-- Brand Mark Header -->
<div class="flex flex-col items-center text-center mb-8"><h1 class="text-[#1B1714] text-[26px] sm:text-[28px] font-bold font-raleway tracking-tight leading-snug mb-2.5">Welcome Back to Your Circle</h1><p class="text-[#5C534A] text-sm sm:text-base font-serif leading-relaxed">Sign in to resume reading with your salons.</p></div>
<!-- Sign In Form -->
<form class="space-y-5" onsubmit="event.preventDefault();"><!-- Email Field --><div class="space-y-2"><label class="block text-xs uppercase tracking-wider font-semibold font-sans text-[#5C534A]" for="email">Email Address</label><div class="relative"><input class="w-full h-12 bg-white border border-[#D9CFBD] focus:border-[#7A1F2B] rounded-[8px] px-4 text-[#1B1714] placeholder-[#968B7D] text-sm font-sans focus:outline-none focus:ring-1 focus:ring-[#7A1F2B] transition duration-200" id="email" placeholder="name@example.com" required="" type="email"/></div></div><!-- Password Field --><div class="space-y-2"><label class="block text-xs uppercase tracking-wider font-semibold font-sans text-[#5C534A]" for="password">Password</label><div class="relative"><input class="w-full h-12 bg-white border border-[#D9CFBD] focus:border-[#7A1F2B] rounded-[8px] pl-4 pr-11 text-[#1B1714] placeholder-[#968B7D] text-sm font-sans focus:outline-none focus:ring-1 focus:ring-[#7A1F2B] transition duration-200" id="password" placeholder="••••••••••••" required="" type="password"/><button aria-label="Toggle password visibility" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-[#6B6258] hover:text-[#1B1714] focus:outline-none transition-colors" id="togglePassword" type="button"><span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span></button></div></div><!-- Row: Remember me & Forgot Password --><div class="flex items-center justify-between pt-1"><label class="flex items-center gap-2.5 cursor-pointer group"><input class="w-4 h-4 rounded-[4px] border-[#D9CFBD] bg-white text-[#7A1F2B] focus:ring-0 focus:ring-offset-0 focus:outline-none cursor-pointer accent-[#7A1F2B]" type="checkbox"/><span class="text-xs font-sans text-[#5C534A] group-hover:text-[#1B1714] transition-colors">Remember this device</span></label><a class="text-xs font-sans font-medium text-[#7A1F2B] hover:underline transition-all" href="#">Forgot password?</a></div><!-- Action Button --><div class="pt-2"><button class="w-full h-12 bg-[#7A1F2B] hover:bg-[#651823] text-[#FBF8F2] font-sans font-semibold rounded-[12px] flex items-center justify-center gap-2 shadow-md shadow-[#7A1F2B]/15 active:scale-[0.99] transition duration-200 cursor-pointer" type="submit"><span>Sign In</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span></button></div></form>
<!-- Divider -->
<!-- Social Logins -->
</div>
<!-- Register Link -->
<div class="mt-8 text-center text-sm font-sans"><span class="text-[#5C534A]">New to Bookly?</span><a class="ml-1 text-[#7A1F2B] hover:underline font-medium transition-colors" href="#">Create an account</a></div>
</main>
<!-- Literary Quote Subtle Footer -->
<footer class="w-full max-w-7xl mx-auto px-6 py-6 text-center text-xs font-serif text-text-placeholder/60 relative z-10"><p class="text-xs font-serif italic text-[#7C7267]">“A room without books is like a body without a soul.” — Cicero</p></footer>
<script>
    // Password toggle functionality
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  </script>
</body></html>
